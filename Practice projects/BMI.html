<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #212121;">
    <div class="container" style="background-color: rgba(255, 255, 255, 0.258);">
        <h2 style="color: whitesmoke;">BMI Calculator:</h2>
        <form style="display: flex;flex-direction: column;"> 
            <span style="padding-bottom: 20px;">
                <label for="weight" style="font-weight: bold;font-family: calibri; color: #212121;letter-spacing: .8px;">Weight (in Kg):</label>
                <input type="text" name="Weight" id="weight" style="border-radius: 5px;background-color: rgba(255, 255, 255, 0.285);padding: 2px;">
            </span>
            <span style="padding-bottom: 20px;">    
                <label for="weight" style="font-weight: bold;font-family: calibri; color: #212121;letter-spacing: .8px;">Height (in Meters):</label>
                <input type="text" name="Height" id="height" style="border-radius: 5px;background-color: rgba(255, 255, 255, 0.285);padding: 2px;">
            </span>
            <input type="submit" value="Submit" style="background-color: rgba(255, 255, 255, 0.285); border-radius: 5px;padding: 10px; font-family: calibri; font-weight: 500;">
        </form>
    </div>
</body>
<script src="script.js"></script>
</html>
